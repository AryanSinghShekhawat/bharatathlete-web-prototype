<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatAthlete Mega Demo</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1635987579/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;padding:0;font-family:sans-serif;background:#0b0f23;color:#e0eaff;transition:background 0.5s;}
.container{max-width:1200px;margin:auto;padding:10px;}
h1,h2,h3{margin:0;}
.flex{display:flex;gap:10px;flex-wrap:wrap;}
.card{background:#11162a;padding:15px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.4);}
button{background:#06b6d4;color:#000;border:none;padding:10px 15px;border-radius:12px;font-weight:600;cursor:pointer;transition:all 0.3s;}
button:hover{transform:scale(1.05);box-shadow:0 0 15px #06b6d4;}
.metric{position:relative;text-align:center;padding:8px;border-radius:8px;background:#071029;min-width:100px;transition:all 0.3s;}
.progress-bar{width:100%;height:10px;background:#333;border-radius:5px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;width:0%;background:#06b6d4;transition:width 0.5s;}
.badge{display:inline-block;padding:6px 10px;border-radius:50px;background:linear-gradient(90deg,#f59e0b,#ef4444);color:#111;font-weight:700;animation:badgePulse 1s infinite alternate;}
@keyframes badgePulse{0%{transform:scale(1);}100%{transform:scale(1.2);}}
.leaderboard,.log{max-height:200px;overflow-y:auto;font-size:14px;margin-top:5px;}
.confetti{pointer-events:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;}
.notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#06b6d4;color:#000;padding:10px 15px;border-radius:10px;font-weight:700;animation:fadeOut 2s forwards;}
@keyframes fadeOut{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50px);}}
img.avatar{width:80px;height:80px;border-radius:50%;transition:transform 0.3s;}
img.avatar.happy{transform:scale(1.2) rotate(-10deg);}
#camera{width:100%;max-width:400px;border-radius:12px;margin-top:10px;}
#langSelect{padding:6px;border-radius:6px;margin-bottom:10px;}
@media(max-width:900px){.flex{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
<header class="flex" style="justify-content:space-between;align-items:center;">
<h1>BharatAthlete</h1>
<div>
<select id="langSelect">
<option value="en">English</option>
<option value="hi">हिन्दी</option>
<option value="ta">தமிழ்</option>
</select><br>
<div class="badge" id="userBadge">Novice</div><br>
<span id="streakLabel">Streak: <span id="streak">0</span> days</span>
</div>
</header>

<div class="flex" style="margin-top:10px;">
<div class="left" style="flex:1;">
<div class="card">
<h3 id="profileTitle">Profile</h3>
<input type="text" id="username" placeholder="Enter Name">
<button id="setAvatarBtn">Set Avatar</button><br>
<img id="avatarImg" src="https://i.imgur.com/6YVJr2G.png" class="avatar">
</div>

<div class="card">
<h3 id="metricsTitle">Metrics</h3>
<div class="flex" style="margin-top:8px;">
<div class="metric" id="jumpMetric">Jump<br><span id="jumpVal">0</span>
<div class="progress-bar"><div id="jumpBar" class="progress-fill"></div></div></div>
<div class="metric" id="repMetric">Reps<br><span id="repsVal">0</span>
<div class="progress-bar"><div id="repsBar" class="progress-fill"></div></div></div>
<div class="metric" id="scoreMetric">Score<br><span id="scoreVal">0</span>
<div class="progress-bar"><div id="scoreBar" class="progress-fill"></div></div></div>
</div>
</div>

<div class="card">
<h3>Actions</h3>
<button id="jumpBtn">Jump</button>
<button id="situpBtn">Sit-Up</button>
<button id="runBtn">Run</button>
</div>

<video id="camera" autoplay muted playsinline></video>
</div>

<div class="right" style="width:420px;">
<div class="card">
<h3 id="leaderboardTitle">Leaderboard</h3>
<div class="leaderboard" id="leaderboard"></div>
</div>

<div class="card">
<h3 id="activityLogTitle">Activity Log</h3>
<div class="log" id="log"></div>
</div>

<div class="card">
<h3 id="perfHistoryTitle">Performance History</h3>
<canvas id="chart" width="400" height="200"></canvas>
</div>
</div>
</div>
</div>

<div id="confettiContainer" class="confetti"></div>

<script>
// Multi-language support
const langData={
en:{jump:"Jump",situp:"Sit-Up",run:"Run",profile:"Profile",metrics:"Metrics",score:"Score",streak:"Streak",leaderboard:"Leaderboard",activityLog:"Activity Log",performanceHistory:"Performance History",enterName:"Enter Name"},
hi:{jump:"कूद",situp:"सिट-अप",run:"दौड़",profile:"प्रोफ़ाइल",metrics:"मेट्रिक्स",score:"स्कोर",streak:"स्ट्रीक",leaderboard:"लीडरबोर्ड",activityLog:"गतिविधि लॉग",performanceHistory:"प्रदर्शन इतिहास",enterName:"नाम दर्ज करें"},
ta:{jump:"ஏறுதல்",situp:"சிட்அப்",run:"ஓடு",profile:"சுயவிவரம்",metrics:"மெட்ரிக்ஸ்",score:"மதிப்பெண்",streak:"தொடர்",leaderboard:"முன்னணிச் பட்டியல்",activityLog:"செயற்பாடு பதிவு",performanceHistory:"செயல்திறன் வரலாறு",enterName:"பெயரை உள்ளிடவும்"}
};
document.getElementById('langSelect').addEventListener('change',e=>{
let l=e.target.value;
document.getElementById('jumpBtn').innerText=langData[l].jump;
document.getElementById('situpBtn').innerText=langData[l].situp;
document.getElementById('runBtn').innerText=langData[l].run;
document.getElementById('profileTitle').innerText=langData[l].profile;
document.getElementById('metricsTitle').innerText=langData[l].metrics;
document.getElementById('scoreMetric').innerText=langData[l].score;
document.getElementById('streakLabel').innerHTML=langData[l].streak+': <span id="streak">'+streak+'</span>';
document.getElementById('leaderboardTitle').innerText=langData[l].leaderboard;
document.getElementById('activityLogTitle').innerText=langData[l].activityLog;
document.getElementById('perfHistoryTitle').innerText=langData[l].performanceHistory;
document.getElementById('username').placeholder=langData[l].enterName;
});

// Metrics
let jump=0,reps=0,score=0,streak=0;
const jumpVal=document.getElementById('jumpVal'),repsVal=document.getElementById('repsVal'),scoreVal=document.getElementById('scoreVal');
const streakEl=document.getElementById('streak');
const logDiv=document.getElementById('log');
const leaderboardDiv=document.getElementById('leaderboard');
const badgeEl=document.getElementById('userBadge');
const usernameInput=document.getElementById('username');
const avatarImg=document.getElementById('avatarImg');
const setAvatarBtn=document.getElementById('setAvatarBtn');
const jumpBar=document.getElementById('jumpBar'),repsBar=document.getElementById('repsBar'),scoreBar=document.getElementById('scoreBar');
const chartCtx=document.getElementById('chart').getContext('2d');

let username='Player';
let chart=new Chart(chartCtx,{type:'line',data:{labels:[],datasets:[{label:'Score',data:[],borderColor:'#06b6d4',backgroundColor:'rgba(6,182,212,0.2)'}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}});

function logMsg(msg){const p=document.createElement('div');p.innerText='['+new Date().toLocaleTimeString()+'] '+msg;logDiv.prepend(p);}
function notify(msg){const n=document.createElement('div');n.className='notification';n.innerText=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2000);}
function updateLeaderboard(){let data=JSON.parse(localStorage.getItem('ba_results')||'[]');
